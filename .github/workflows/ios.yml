name: iOS

# Xcode only runs on macOS, so iOS builds/tests use a macOS runner.
# Docker-OSX is a slow local fallback only and is never used for distribution.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Select an available simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9A-Za-z ]+' | head -1 | xargs)
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project PagerApp.xcodeproj \
            -scheme PagerApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"

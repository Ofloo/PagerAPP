global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s

frontend http
    bind *:80
    redirect scheme https code 301

frontend https
    bind *:443 ssl crt /run/secrets/haproxy_le alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    default_backend pagerapp

backend pagerapp
    # The web instance only listens on the private overlay network. TLS is verified against
    # the internal CA; the Let's Encrypt certificate is only on the public frontend.
    server web web:8443 ssl verify required ca-file /run/secrets/pagerapp_internal_ca check
